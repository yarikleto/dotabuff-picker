<!doctype html>
<!--
  The README banner, rendered to docs/assets/banner.jpg by
  `npm run readme:images`. 1280×640 is also the size GitHub asks for as a
  repository's social preview. Colours are the app's own (src/styles.css).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>banner</title>
    <style>
      :root {
        --bg: #0f1419;
        --text: #dfe6ee;
        --dim: #8a97a6;
        --mine: #38b45f;
        --enemy: #e0483d;
        --intent: #c9a227;
        --good: #4ec46f;
        --bad: #e2685e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(760px 520px at 0% 110%, rgba(56, 180, 95, 0.26), transparent 62%),
          radial-gradient(720px 500px at 104% -8%, rgba(224, 72, 61, 0.24), transparent 60%),
          radial-gradient(520px 360px at 70% 70%, rgba(201, 162, 39, 0.1), transparent 70%),
          var(--bg);
      }

      .board {
        position: absolute;
        left: 470px;
        top: -170px;
        display: grid;
        grid-template-columns: repeat(7, 168px);
        gap: 14px;
        transform: perspective(1600px) rotateX(14deg) rotateZ(-13deg);
        transform-origin: 30% 40%;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 30%, #000 100%);
      }
      .tile {
        position: relative;
        width: 168px;
        height: 94px;
        border-radius: 12px;
        overflow: hidden;
        background: #1b232c;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 24px rgba(0, 0, 0, 0.45);
      }
      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.85) brightness(0.78);
      }
      .tile.mine {
        box-shadow: 0 0 0 3px var(--mine), 0 0 30px rgba(56, 180, 95, 0.6);
      }
      .tile.enemy {
        box-shadow: 0 0 0 3px var(--enemy), 0 0 30px rgba(224, 72, 61, 0.6);
      }
      .tile.pick {
        box-shadow: 0 0 0 3px var(--intent), 0 0 38px rgba(201, 162, 39, 0.75);
      }
      .tile.mine img,
      .tile.enemy img,
      .tile.pick img {
        filter: none;
      }
      .tile.banned img {
        filter: grayscale(1) brightness(0.38);
      }
      .tile.banned::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top right,
          transparent calc(50% - 1.5px),
          rgba(210, 220, 230, 0.75) 50%,
          transparent calc(50% + 1.5px)
        );
      }
      .score {
        position: absolute;
        top: 6px;
        right: 6px;
        padding: 3px 7px;
        border-radius: 7px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        background: rgba(15, 20, 25, 0.82);
      }
      .score.up {
        color: var(--good);
      }
      .score.down {
        color: var(--bad);
      }
      .tile.pick .score {
        color: #f1cf5d;
      }

      /* Keeps the copy readable where the board runs under it. */
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(15, 20, 25, 0.96) 0%,
          rgba(15, 20, 25, 0.9) 34%,
          rgba(15, 20, 25, 0.35) 56%,
          rgba(15, 20, 25, 0) 72%
        );
      }

      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 84px;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .icon {
        width: 108px;
        height: 108px;
        margin: 0 0 30px -8px;
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
      }
      .overline {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: var(--intent);
      }
      h1 {
        margin-top: 10px;
        font-size: 78px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: #f4f7fa;
      }
      .tagline {
        margin-top: 22px;
        max-width: 500px;
        font-size: 25px;
        line-height: 1.38;
        color: #b9c4cf;
      }
      .chips {
        display: flex;
        gap: 8px;
        margin-top: 30px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        background: rgba(226, 238, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.13);
      }
      .chip i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="board" id="board"></div>
    <div class="shade"></div>

    <div class="copy">
      <img class="icon" src="../build/icon.png" alt="" />
      <div class="overline">DOTA 2</div>
      <h1>Draft Picker</h1>
      <p class="tagline">Counter-picks, synergies and lane matchups for every pick and ban.</p>
      <div class="chips">
        <span class="chip"><i style="background: var(--enemy)"></i>Counters</span>
        <span class="chip"><i style="background: var(--mine)"></i>Synergies</span>
        <span class="chip"><i style="background: var(--intent)"></i>Lanes by seat</span>
        <span class="chip"><i style="background: #6f8fb8"></i>Rank bands</span>
      </div>
    </div>

    <script>
      // Seven columns; slug, then an optional state or score. Only columns 1–3
      // from row 2 down land fully inside the frame, so every coloured tile
      // sits there.
      const BOARD = [
        "anti-mage", "earthshaker", "rubick", "juggernaut", "storm-spirit", "mars", "bristleback",
        "shadow-fiend", "templar-assassin", "witch-doctor:+3.2", "void-spirit", "dark-willow", "legion-commander", "windranger",
        "tiny", "lina", "crystal-maiden:mine", "pudge:banned", "kez:+0.7", "largo", "ringmaster",
        "morphling", "axe:enemy", "spectre:+2.9", "leshrac:pick:+7.6", "queen-of-pain", "snapfire", "magnus",
        "muerta:-1.4", "luna", "slark:+1.3", "faceless-void:mine", "medusa", "ember-spirit:-2.1", "zeus",
        "terrorblade", "dawnbreaker:+0.9", "invoker:enemy", "primal-beast", "marci:+1.8", "hoodwink", "pangolier",
        "sniper", "ursa", "sven:-1.2", "lion:enemy", "naga-siren:+2.2", "centaur-warrunner", "keeper-of-the-light",
        "nyx-assassin", "phantom-assassin:banned", "treant-protector:-0.8", "enigma:+1.1", "necrophos", "wraith-king", "lifestealer",
      ];

      const board = document.getElementById("board");
      for (const entry of BOARD) {
        const [slug, ...marks] = entry.split(":");
        const tile = document.createElement("div");
        tile.className = "tile";
        const img = document.createElement("img");
        img.src = `../public/heroes/${slug}.png`;
        img.alt = "";
        tile.append(img);
        for (const mark of marks) {
          if (/^[+-]/.test(mark)) {
            const score = document.createElement("span");
            score.className = `score ${mark.startsWith("+") ? "up" : "down"}`;
            score.textContent = mark.replace("-", "−");
            tile.append(score);
          } else {
            tile.classList.add(mark);
          }
        }
        board.append(tile);
      }
    </script>
  </body>
</html>
