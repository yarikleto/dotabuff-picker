<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dota 2 pick and ban assistant: ranks every hero against the enemy draft and beside your own, from Dotabuff, STRATZ and OpenDota data."
    />
    <meta name="theme-color" content="#0f1419" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Dota 2 Draft Picker</title>
    <!-- Before first paint, so a light page never flashes dark. Mirrors src/state/theme.ts. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("dotabuff-picker.theme");
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9eef3");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
